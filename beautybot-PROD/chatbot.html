<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --cor: #c9956a; --cor-dark: #a07048; --cor-light: rgba(201,149,106,0.12); --bg: #f5f4f2; --card: #fff; --border: #e8e2d9; --text: #1a1a1a; --muted: #7a7570; --radius: 16px; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  #chat-widget { width: 390px; background: var(--card); border-radius: 20px; box-shadow: 0 8px 40px rgba(0,0,0,0.13); overflow: hidden; display: flex; flex-direction: column; max-height: 640px; }
  #chat-header { background: var(--cor); color: white; padding: 16px 18px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #chat-avatar { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 20px; overflow: hidden; flex-shrink: 0; }
  #chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
  #chat-header-info h2 { font-size: 15px; font-weight: 600; }
  #chat-header-info p { font-size: 11px; opacity: 0.8; margin-top: 1px; }
  #chat-status { margin-left: auto; display: flex; align-items: center; gap: 5px; font-size: 11px; opacity: 0.9; }
  #chat-status::before { content: ''; width: 7px; height: 7px; background: #00ff88; border-radius: 50%; display: block; }
  #chat-msgs { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); }
  #chat-msgs::-webkit-scrollbar { width: 4px; }
  #chat-msgs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .msg-bot { align-self: flex-start; max-width: 85%; animation: fadeUp 0.2s ease; }
  .msg-bot-nome { font-size: 10px; font-weight: 600; color: var(--cor); margin-bottom: 4px; margin-left: 2px; }
  .msg-bot-balao { background: var(--card); border: 1px solid var(--border); padding: 10px 14px; border-radius: 16px 16px 16px 4px; font-size: 13.5px; line-height: 1.6; color: var(--text); }
  .msg-user { align-self: flex-end; max-width: 85%; animation: fadeUp 0.2s ease; }
  .msg-user-balao { background: var(--cor); color: white; padding: 10px 14px; border-radius: 16px 16px 4px 16px; font-size: 13.5px; line-height: 1.6; }

  /* Cartão de serviço */
  .srv-card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; margin-top: 7px; }
  .srv-card-nome { font-weight: 600; color: var(--cor-dark); margin-bottom: 4px; font-size: 13px; }
  .srv-card-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .srv-card-meta { font-size: 11px; color: var(--muted); margin-top: 5px; }

  /* Digitando */
  .typing { display: flex; gap: 4px; align-items: center; padding: 12px 14px; }
  .typing span { width: 7px; height: 7px; background: var(--muted); border-radius: 50%; animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:0.4}30%{transform:translateY(-5px);opacity:1} }
  @keyframes fadeUp { from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)} }

  /* Chips */
  #chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px 4px; background: var(--bg); flex-shrink: 0; }
  .chip { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px; font-size: 12px; cursor: pointer; color: var(--text); font-family: 'DM Sans', sans-serif; transition: all 0.15s; white-space: nowrap; }
  .chip:hover { background: var(--cor-light); border-color: var(--cor); color: var(--cor-dark); }
  .chip.active { background: var(--cor); color: white; border-color: var(--cor); }

  /* Input */
  #chat-input-area { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--border); background: var(--card); flex-shrink: 0; }
  #chat-input { flex: 1; border: 1px solid var(--border); border-radius: 24px; padding: 10px 16px; font-size: 13.5px; font-family: 'DM Sans', sans-serif; color: var(--text); background: var(--bg); outline: none; transition: border-color 0.15s; }
  #chat-input:focus { border-color: var(--cor); background: white; }
  #chat-send { width: 40px; height: 40px; border-radius: 50%; background: var(--cor); border: none; color: white; font-size: 16px; cursor: pointer; flex-shrink: 0; transition: background 0.15s, transform 0.1s; font-family: 'DM Sans', sans-serif; }
  #chat-send:hover { background: var(--cor-dark); }
  #chat-send:active { transform: scale(0.93); }

  /* Aviso pesquisa */
  .msg-pesquisa { font-size: 11px; color: var(--muted); font-style: italic; margin-top: 4px; }

  /* Footer */
  #chat-footer { text-align: center; padding: 7px; font-size: 10px; color: var(--muted); background: var(--card); border-top: 1px solid var(--border); flex-shrink: 0; }
  #chat-footer a { color: var(--cor); text-decoration: none; font-weight: 500; }

  /* Aviso sem config */
  #aviso-config { display: none; text-align: center; padding: 40px 24px; color: var(--muted); }
  #aviso-config span { font-size: 40px; display: block; margin-bottom: 12px; }
  #aviso-config h3 { font-size: 16px; color: var(--text); margin-bottom: 8px; }
  #aviso-config p { font-size: 13px; line-height: 1.6; }
  #aviso-config a { color: var(--cor); font-weight: 500; }
</style>
</head>
<body>
<div id="chat-widget">
  <div id="chat-header">
    <div id="chat-avatar">🌸</div>
    <div id="chat-header-info">
      <h2 id="chat-nome-assistente">Assistente</h2>
      <p id="chat-nome-negocio">A carregar...</p>
    </div>
    <div id="chat-status">Online</div>
  </div>
  <div id="chat-msgs">
    <div id="aviso-config">
      <span>⚙️</span>
      <h3>Chatbot não configurado</h3>
      <p>Abre o <a href="dashboard.html">painel de configuração</a>, preenche os dados e clica em <b>Guardar</b>. Depois volta aqui!</p>
    </div>
  </div>
  <div id="chips"></div>
  <div id="chat-input-area">
    <input type="text" id="chat-input" placeholder="Escreve uma mensagem..." />
    <button id="chat-send" onclick="enviar()">➤</button>
  </div>
  <div id="chat-footer">Powered by <a href="#">BeautyBot Studio</a></div>
</div>

<script>
// ──────────────────────────────────────────────
// ESTADO GLOBAL
// ──────────────────────────────────────────────
const DIAS_NOMES = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
let config = null;
let historico = [];            // histórico de mensagens para o Claude
let ultimoServico = null;      // último serviço mencionado (contexto)
let aguardandoResposta = false;
let nomeCliente = null;        // nome do cliente capturado na conversa
let _usouNomeUltimaResposta = false; // controla alternância do nome

// ──────────────────────────────────────────────
// CARREGAR CONFIG DO DASHBOARD
// ──────────────────────────────────────────────
function carregarConfig() {
  const g = localStorage.getItem('beautybot_config');
  if (!g) return false;
  try { config = JSON.parse(g); return true; }
  catch(e) { return false; }
}

function aplicarIdentidade() {
  document.documentElement.style.setProperty('--cor', config.corPrincipal || '#c9956a');
  document.documentElement.style.setProperty('--cor-dark', escurecer(config.corPrincipal || '#c9956a'));
  document.getElementById('chat-nome-assistente').textContent = config.nomeAssistente || 'Assistente';
  document.getElementById('chat-nome-negocio').textContent = config.nomeNegocio || '';
  document.title = (config.nomeNegocio || 'Chatbot') + ' — Assistente Virtual';
  const av = document.getElementById('chat-avatar');
  av.innerHTML = config.logoBase64 ? `<img src="${config.logoBase64}" alt="logo">` : '🌸';
}

function escurecer(hex) {
  let r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.max(0,r-30)},${Math.max(0,g-30)},${Math.max(0,b-30)})`;
}

// ──────────────────────────────────────────────
// GESTÃO DO NOME DO CLIENTE
// ──────────────────────────────────────────────
function extrairNomeDaMensagem(texto) {
  // Padrões comuns de apresentação
  const padroes = [
    /meu nome (é|e) ([a-záéíóúâêîôûãõàèìòùäëïöüç]+)/i,
    /me chamo ([a-záéíóúâêîôûãõàèìòùäëïöüç]+)/i,
    /sou (a |o )?([a-záéíóúâêîôûãõàèìòùäëïöüç]+)/i,
    /pode me chamar de ([a-záéíóúâêîôûãõàèìòùäëïöüç]+)/i,
    /^([a-záéíóúâêîôûãõàèìòùäëïöüç]+)$/i, // mensagem é só o nome
  ];

  for (let padrao of padroes) {
    const match = texto.match(padrao);
    if (match) {
      const nome = match[match.length - 1];
      // Valida — não é uma palavra comum
      const palavrasComuns = ['sim','nao','não','ola','olá','oi','bom','boa',
        'quero','tenho','estou','pode','tem','qual','como','onde'];
      if (!palavrasComuns.includes(nome.toLowerCase()) && nome.length >= 2) {
        return nome.charAt(0).toUpperCase() + nome.slice(1).toLowerCase();
      }
    }
  }
  return null;
}

function saudacaoComNome(texto) {
  if (!nomeCliente) return texto;

  // Nunca adiciona o nome se a resposta já o contém
  if (texto.includes(nomeCliente)) return texto;

  // Não aplica em mensagens muito curtas
  if (texto.length < 25) return texto;

  // Alterna — usa o nome UMA VEZ SIM, UMA VEZ NÃO
  if (_usouNomeUltimaResposta) {
    _usouNomeUltimaResposta = false;
    return texto; // Esta vez sem nome
  }
  _usouNomeUltimaResposta = true;

  // Insere o nome após o primeiro ponto ou ! da resposta (posição mais natural)
  const fimFrase = texto.search(/[.!]/);
  if (fimFrase > 10 && fimFrase < 100) {
    return texto.slice(0, fimFrase + 1) + ' ' + nomeCliente + ',' + texto.slice(fimFrase + 1);
  }

  // Fallback — insere no início com vírgula
  return `${nomeCliente}, ${texto.charAt(0).toLowerCase()}${texto.slice(1)}`;
}

// ──────────────────────────────────────────────
// CHIPS DE ACESSO RÁPIDO
// ──────────────────────────────────────────────
function renderChips() {
  const chips = document.getElementById('chips');
  const opcoes = [
    { label: '💆 Serviços', acao: () => { document.getElementById('chat-input').value = 'Que serviços têm disponíveis?'; enviar(); }},
    { label: '💶 Preços',   acao: () => { document.getElementById('chat-input').value = 'Qual o preço de cada serviço?'; enviar(); }},
    { label: '🕐 Horário',  acao: () => { document.getElementById('chat-input').value = 'Qual o vosso horário?'; enviar(); }},
    { label: '📅 Marcar',   acao: () => { document.getElementById('chat-input').value = 'Quero fazer uma marcação'; enviar(); }},
  ];
  chips.innerHTML = '';
  opcoes.forEach(op => {
    const el = document.createElement('button');
    el.className = 'chip';
    el.textContent = op.label;
    el.onclick = op.acao;
    chips.appendChild(el);
  });
}

// ──────────────────────────────────────────────
// EXIBIR MENSAGENS
// ──────────────────────────────────────────────
function adicionarMsgBot(html, comDelay = true) {
  // Protecção contra null/undefined — nunca deve aparecer
  if (html === null || html === undefined || html === '') {
    html = respostaNaoSei();
  }
  return new Promise(resolve => {
    const msgs = document.getElementById('chat-msgs');
    const el = document.createElement('div');
    el.className = 'msg-bot';
    el.innerHTML = `
      <div class="msg-bot-nome">${config.nomeAssistente || 'Bot'}</div>
      <div class="msg-bot-balao">
        <div class="typing"><span></span><span></span><span></span></div>
      </div>`;
    msgs.appendChild(el);
    msgs.scrollTop = msgs.scrollHeight;

    setTimeout(() => {
      el.querySelector('.msg-bot-balao').innerHTML = html;
      msgs.scrollTop = msgs.scrollHeight;
      historico.push({ role: 'assistant', content: html.replace(/<[^>]+>/g,'') });
      resolve();
    }, comDelay ? 850 : 0);
  });
}

function adicionarMsgUser(texto) {
  const msgs = document.getElementById('chat-msgs');
  const el = document.createElement('div');
  el.className = 'msg-user';
  el.innerHTML = `<div class="msg-user-balao">${texto}</div>`;
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
  historico.push({ role: 'user', content: texto });
}

// ──────────────────────────────────────────────
// ENVIAR MENSAGEM
// ──────────────────────────────────────────────
async function enviar() {
  if (aguardandoResposta) return;
  const input = document.getElementById('chat-input');
  const texto = input.value.trim();
  if (!texto) return;

  adicionarMsgUser(texto);
  input.value = '';
  aguardandoResposta = true;

  // ── Captura nome do cliente se mencionado ──
  const nomeDetectado = extrairNomeDaMensagem(texto);
  if (nomeDetectado && !nomeCliente) {
    nomeCliente = nomeDetectado;
  }

  // ── Primeira mensagem: pede o nome se ainda não o souber ──
  const numMensagensUtilizador = historico.filter(m => m.role === 'user').length;
  if (!nomeCliente && numMensagensUtilizador === 1) {
    // Guarda a pergunta original para processar depois
    window._perguntaPendente = texto;
    await adicionarMsgBot(
      `Olá! 😊 Antes de mais, qual é o seu nome? Assim posso ajudá-la de forma mais personalizada!`
    );
    aguardandoResposta = false;
    return;
  }

  // ── Cliente acabou de dar apenas o nome (mensagem é só o nome) ──
  const textoLimpo = texto.trim();
  const ehApenasnome = nomeDetectado &&
    textoLimpo.split(/\s+/).length <= 3 &&
    !textoLimpo.includes('?') &&
    !window._perguntaPendente;
  if (ehApenasnome && !window._perguntaPendente) {
    // Só o nome — confirma e aguarda próxima mensagem
    await adicionarMsgBot(`Prazer, ${nomeCliente}! 😊 Como posso ajudar?`);
    aguardandoResposta = false;
    return;
  }

  // ── Processa pergunta pendente ou nome dado sem contexto ──
  let textoParaProcessar = texto;

  if (window._perguntaPendente && nomeCliente) {
    // Tinha pergunta guardada — usa-a para responder
    textoParaProcessar = window._perguntaPendente;
    window._perguntaPendente = null;
    // UMA única confirmação calorosa antes da resposta
    await adicionarMsgBot(`Prazer, ${nomeCliente}! 💛`);
    // Continua para processar a pergunta pendente abaixo

  } else if (nomeDetectado && !window._perguntaPendente) {
    // Cliente deu o nome sem pergunta pendente
    // Envia UMA única saudação personalizada e para
    const saudacoes = [
      `Prazer em conhecê-la, ${nomeCliente}! 😊 Como posso ajudar?`,
      `Que lindo! Bem-vinda, ${nomeCliente} 🌸 Em que posso ajudá-la?`,
      `Olá, ${nomeCliente}! Fico muito feliz em atender-te. O que procuras?`,
    ];
    await adicionarMsgBot(saudacoes[Math.floor(Math.random() * saudacoes.length)]);
    guardarHistorico();
    aguardandoResposta = false;
    return; // Para aqui — não processa mais nada
  }

  // ── Pré-processamento: interpreta erros e termos desconhecidos ──
  // Se a mensagem tiver erros ou palavras estranhas, o Claude corrige
  // antes de tentar responder — torna o bot muito mais robusto
  const textoProcesado = await interpretarMensagem(textoParaProcessar);
  const textoParaResponder = textoProcesado || textoParaProcessar;

  const t = textoParaResponder.toLowerCase();
  const ehPerguntaPreco = t.includes('preço') || t.includes('preco') || t.includes('custo') || t.includes('quanto') || t.includes('valor') || t.includes('tabela');
  const ehPerguntaServico = procurarServico(t) !== null || t.includes('serviço') || t.includes('tratamento') || t.includes('fazem') || t.includes('têm') || t.includes('disponível');
  const ehProblema = t.includes('problema') || t.includes('reação') || t.includes('reaccao') || t.includes('dor') || t.includes('vermelhidão') || t.includes('inchado') || t.includes('bolha') || t.includes('ardor') || t.includes('irritação') || t.includes('efeito') || t.includes('complicação') || t.includes('recomend') || t.includes('indicad') || t.includes('contra') || t.includes('antes') || t.includes('depois') || t.includes('cuidado') || t.includes('pós') || t.includes('pos-');

  // ── Detecção de PREOCUPAÇÕES PESSOAIS do cliente ──────
  // "tenho manchas", "estou com acne", "minha pele está ressecada"
  // → o cliente descreve um problema, não pede um serviço específico
  const ehPreocupacaoPessoal =
    t.includes('tenho ') || t.includes('estou com') ||
    t.includes('minha pele') || t.includes('meu rosto') ||
    t.includes('no meu rosto') || t.includes('no rosto') ||
    t.includes('no corpo') || t.includes('na pele') ||
    t.includes('me ajuda') || t.includes('podes me ajudar') ||
    t.includes('pode me ajudar') || t.includes('me ajudar') ||
    t.includes('sofro de') || t.includes('problema de') ||
    t.includes('problema com') || t.includes('me incomoda') ||
    t.includes('estou insatisfeita') || t.includes('quero melhorar') ||
    t.includes('quero tratar') || t.includes('quero eliminar') ||
    t.includes('quero reduzir') || t.includes('quero resolver');

  // ── Detecção de perguntas EXPLICATIVAS ──────────
  // "para que serve", "o que é", "como funciona",
  // "me explica", "me fala sobre", "o que faz"
  const ehExplicacao =
    t.includes('para que serve') || t.includes('pra que serve') ||
    t.includes('serve para') || t.includes('serve pra') ||
    t.includes('o que é') || t.includes('o que e ') ||
    t.includes('como funciona') || t.includes('como age') ||
    t.includes('me explica') || t.includes('me fala') ||
    t.includes('me conta') || t.includes('me diz') ||
    t.includes('o que faz') || t.includes('para que é') ||
    t.includes('pra que é') || t.includes('qual o objectivo') ||
    t.includes('qual o objetivo') || t.includes('benefício') ||
    t.includes('beneficio') || t.includes('resultado') ||
    t.includes('indicado para') || t.includes('indicada para') ||
    t.includes('quem pode') || t.includes('funciona como') ||
    (t.includes('esse tratamento') && !ehPerguntaPreco) ||
    (t.includes('este tratamento') && !ehPerguntaPreco) ||
    (t.includes('esse serviço') && !ehPerguntaPreco);

  let resposta;

  // ──────────────────────────────────────────────
  // DECISÃO: usar Claude API ou resposta local
  // ──────────────────────────────────────────────
  if (ehPreocupacaoPessoal) {
    // → Cliente descreve um problema ou preocupação pessoal
    resetarContadorNegativo();

    if (config.apiKey) {
      resposta = await chamarClaude(textoParaResponder);
    } else {
      // Verifica primeiro se é uma RESTRIÇÃO (contraindicação)
      // nos tratamentos já discutidos na conversa
      const protocolosMatch = procurarNosProtocolos(t);
      if (protocolosMatch.length > 0) {
        // Tem info de protocolo relevante — mostra pode/não pode
        resposta = formatarRespostaProtocolo(protocolosMatch, t);
      } else {
        // Não é restrição — procura serviços que ajudam
        resposta = respostaPreocupacaoPessoal(t);
      }
    }
  } else if (ehExplicacao && ultimoServico) {
    // → Pergunta explicativa sobre o último serviço mencionado
    resetarContadorNegativo();
    if (config.apiKey) {
      resposta = await chamarClaude(textoParaResponder);
    } else {
      resposta = explicarServico(ultimoServico, t);
    }
  } else if (config.apiKey && (ehProblema || (ehPerguntaServico && !ehPerguntaPreco && !ehExplicacao))) {
    // → Pergunta técnica: usa Claude com protocolo + pesquisa
    resetarContadorNegativo();
    resposta = await chamarClaude(textoParaResponder);
  } else {
    // → Resposta local (pergunta simples)
    resposta = responderLocalmente(t, ehPerguntaPreco);

    // Se resposta local for null E tiver API Key → usa Claude como fallback
    if (resposta === null && config.apiKey) {
      resposta = await chamarClaude(textoParaResponder);
    }

    // Se ainda for null (sem API key e sem resposta) → mensagem de contacto
    if (resposta === null) {
      resposta = respostaNaoSei();
    }
  }

  // Aplica o nome alternadamente nas respostas
  // Não aplica em mensagens de "volta" ou confirmações curtas
  const ehMensagemSistema = resposta && (
    resposta.includes('Prazer,') ||
    resposta.includes('Bem-vinda,') ||
    resposta.includes('Bem-vindo,') ||
    resposta.includes('de volta!')
  );
  if (nomeCliente && resposta && !ehMensagemSistema) {
    resposta = saudacaoComNome(resposta);
  }

  await adicionarMsgBot(resposta);
  guardarHistorico();
  aguardandoResposta = false;
}

document.getElementById('chat-input').addEventListener('keypress', e => {
  if (e.key === 'Enter') enviar();
});

// ──────────────────────────────────────────────
// RESPOSTA LOCAL — rápida, sem API
// ──────────────────────────────────────────────
function responderLocalmente(t, ehPerguntaPreco) {
  const nome = config.nomeAssistente || 'Assistente';

  // Contexto do último serviço
  if (ultimoServico) {
    if ((t.includes('duração') || t.includes('tempo') || t.includes('demora')) && !ehPerguntaPreco) {
      return `O <b>${ultimoServico.nome}</b> tem duração de <b>${ultimoServico.duracao} minutos</b>.${ultimoServico.sessoes ? ` Recomendamos um protocolo de <b>${ultimoServico.sessoes} sessões</b>.` : ''}`;
    }
  }

  // Preço — SÓ quando explicitamente pedido
  if (ehPerguntaPreco) {
    const servicoEncontrado = procurarServico(t);
    if (servicoEncontrado && ultimoServico) {
      return `O serviço <b>${ultimoServico.nome}</b> tem o preço de <b>${ultimoServico.preco}€</b> por sessão.`;
    }
    if (servicoEncontrado) {
      ultimoServico = servicoEncontrado;
      return `O <b>${servicoEncontrado.nome}</b> custa <b>${servicoEncontrado.preco}€</b> por sessão.`;
    }
    if (!config.servicos || !config.servicos.length) return 'Ainda não temos preços configurados. Contacta-nos para mais informações.';
    let r = '💶 <b>Tabela de Preços</b><br><br>';
    config.servicos.forEach(s => { r += `${s.emoji} ${s.nome}: <b>${s.preco}€</b><br>`; });
    return r;
  }

  // Detecção de perguntas sobre PROTOCOLOS/RESTRIÇÕES
  const ehPerguntaProtocolo =
    t.includes('grávid') || t.includes('gravid') ||
    t.includes('gestante') || t.includes('amament') ||
    t.includes('limite de idade') || t.includes('faixa etária') ||
    t.includes('faixa etaria') || t.includes('anos pode') ||
    t.includes('restrição') || t.includes('restricao') ||
    t.includes('contraindicação') || t.includes('contraindicacao') ||
    t.includes('quem não pode') || t.includes('quem nao pode') ||
    t.includes('pode fazer') || t.includes('posso fazer') ||
    t.includes('alergia') || t.includes('efeito colateral') ||
    t.includes('risco');

  if (ehPerguntaProtocolo) {
    const resultadosProtocolo = procurarNosProtocolos(t);
    if (resultadosProtocolo.length > 0) {
      return formatarRespostaProtocolo(resultadosProtocolo, t);
    }
    return `Para esta questão sobre restrições ou contraindicações, recomendo falar directamente com a nossa equipa:<br><br>📞 <b>${config.telefone || '—'}</b>`;
  }

  // Serviço específico (sem preço)
  const servicoEncontrado = procurarServico(t);
  if (servicoEncontrado) {
    ultimoServico = servicoEncontrado;
    const todosServicos = procurarTodosServicos(t);
    // Detecta se é pergunta ou declaração
    const ehPergunta = t.includes('?') || t.includes('tem ') ||
      t.includes('tens ') || t.includes('fazem') || t.includes('fazem') ||
      t.includes('vocês') || t.includes('voces') || t.includes('disponível') ||
      t.includes('existe') || t.includes('há ');
    if (todosServicos.length > 1) {
      return formatarVariosServicos(todosServicos, t, ehPergunta);
    }
    return formatarServicoSemPreco(servicoEncontrado, ehPergunta);
  }

  // Perguntou sobre um serviço estético que NÃO está cadastrado
  if (parecePerguntaDeServico(t)) {
    return respostaNaoTemos();
  }

  // Lista de serviços (sem preços)
  if (t.includes('serviço') || t.includes('tratamento') || t.includes('fazem') || t.includes('têm') || t.includes('disponível') || t.includes('oferecem')) {
    resetarContadorNegativo();
    return listarServicosSemPreco();
  }

  // Horário
  if (t.includes('horário') || t.includes('hora') || t.includes('aberto') || t.includes('funciona') || t.includes('quando')) {
    return respostaHorario();
  }

  // Marcação
  if (t.includes('marcação') || t.includes('marcar') || t.includes('agendar') || t.includes('reservar') || t.includes('consulta')) {
    return respostaMarcacao();
  }

  // Contactos
  if (t.includes('contacto') || t.includes('telefone') || t.includes('email') || t.includes('morada') || t.includes('onde') || t.includes('localização')) {
    return respostaContactos();
  }

  // Saudações
  if (t.includes('olá') || t.includes('ola') || t.includes('oi') || t.includes('bom dia') || t.includes('boa tarde') || t.includes('boa noite')) {
    // Sem nome aqui — saudacaoComNome() trata da alternância
    return `Olá! 😊 Como posso ajudar? Podes perguntar sobre serviços, horários ou marcações.`;
  }

  if (t.includes('obrigad') || t.includes('brigad')) {
    return `Disponha! 😊 Estou aqui para o que precisares.`;
  }

  // Default — sem resposta local conhecida
  // (o caller tratará: Claude se API disponível, senão contacto)
  return null;
}

// EXPLICAR SERVIÇO — usa protocolo do dashboard
// Usado quando não há API Key mas cliente pergunta
// "para que serve", "como funciona", etc.
// ──────────────────────────────────────────────
function explicarServico(s, pergunta) {
  const nome = s.nome;
  const emoji = s.emoji || '✨';

  // Monta a explicação com base no que está preenchido no protocolo
  let partes = [];

  // Descrição geral
  if (s.descricao) {
    partes.push(s.descricao);
  }

  // Indicações — para que serve / para quem é indicado
  if (s.indicacoes) {
    if (pergunta.includes('quem') || pergunta.includes('indicado') || pergunta.includes('indicada')) {
      partes.push(`<b>Para quem é indicado:</b><br>${s.indicacoes}`);
    } else {
      partes.push(`<b>Para que serve:</b><br>${s.indicacoes}`);
    }
  }

  // Resultados esperados
  if (s.resultados && (pergunta.includes('resultado') || pergunta.includes('benefício') || pergunta.includes('beneficio') || pergunta.includes('efeito'))) {
    partes.push(`<b>Resultados esperados:</b><br>${s.resultados}`);
  } else if (s.resultados) {
    partes.push(`<b>Resultados:</b><br>${s.resultados}`);
  }

  // Se nada preenchido no protocolo
  if (partes.length === 0) {
    return `O <b>${nome}</b> é um dos nossos tratamentos disponíveis com duração de <b>${s.duracao || 60} minutos</b>. Para informações detalhadas sobre como funciona, fala connosco:<br>📞 <b>${config.telefone || '—'}</b>`;
  }

  return `${emoji} <b>${nome}</b><br><br>${partes.join('<br><br>')}<br><br>Tens mais questões ou queres saber o preço?`;
}

// ──────────────────────────────────────────────
// PRÉ-PROCESSAMENTO — interpreta palavras desconhecidas
// Antes de responder, verifica se há erros de digitação
// ou palavras do universo da estética não reconhecidas
// ──────────────────────────────────────────────
async function interpretarMensagem(mensagemOriginal) {
  if (!config.apiKey) return mensagemOriginal;

  const t = mensagemOriginal.toLowerCase();

  // Só activa se a mensagem for curta (provável palavra isolada ou frase simples)
  // OU se contiver palavras que parecem desconhecidas
  const palavrasConhecidas = [
    'olá','oi','bom dia','boa tarde','boa noite','obrigad','sim','não',
    'quero','posso','pode','tem','tens','qual','como','quando','onde',
    'preço','preco','custo','quanto','valor','horário','horario',
    'marcar','marcação','agendar','contacto','telefone','email','morada',
    'serviço','servico','tratamento','ajuda','informação','informacao'
  ];

  const temPalavraConhecida = palavrasConhecidas.some(p => t.includes(p));
  const palavras = t.trim().split(/\s+/);
  const ehMensagemCurta = palavras.length <= 4;

  // Se tem palavras conhecidas suficientes, não precisa de interpretação
  if (temPalavraConhecida && !ehMensagemCurta) return mensagemOriginal;

  // Verifica se alguma palavra parece estranha (possível erro ou termo técnico)
  const temPalavraEstranha = palavras.some(p => {
    if (p.length < 3) return false;
    // Palavras completamente fora do vocabulário comum português
    const vogais = (p.match(/[aeiouáéíóúâêîôûãõ]/gi) || []).length;
    const ratioVogais = vogais / p.length;
    // Palavras com menos de 15% de vogais são suspeitas (erros de digitação)
    return ratioVogais < 0.15 && p.length > 4;
  });

  // Se for mensagem muito curta OU tiver palavra estranha → pede ao Claude para interpretar
  if (ehMensagemCurta || temPalavraEstranha) {
    try {
      const servicosNomes = config.servicos
        ? config.servicos.map(s => s.nome).join(', ')
        : '';

      const promptInterpretacao = `Analisa esta mensagem de um cliente numa clínica de estética: "${mensagemOriginal}"

Contexto — serviços disponíveis na clínica: ${servicosNomes || 'não especificados'}

A tua tarefa:
1. Verifica se há erros de digitação ou abreviações
2. Verifica se a palavra/frase pertence ao universo da estética e beleza (mesmo que mal escrita)
3. Devolve APENAS um JSON com este formato exacto:
{
  "mensagemInterpretada": "versão corrigida e clara da mensagem",
  "estetica": true/false,
  "confianca": "alta/media/baixa",
  "explicacao": "o que a palavra significa no contexto estético (se aplicável)"
}

Exemplos:
- "limpea de pele" → {"mensagemInterpretada":"limpeza de pele","estetica":true,"confianca":"alta","explicacao":"limpeza de pele é um tratamento facial de higienização profunda"}
- "tem botoc" → {"mensagemInterpretada":"tem botox","estetica":true,"confianca":"alta","explicacao":"botox é o nome popular da toxina botulínica usada em estética"}
- "qual o tempo" → {"mensagemInterpretada":"qual o horário","estetica":false,"confianca":"media","explicacao":""}
- "rdiofrqncia" → {"mensagemInterpretada":"radiofrequência","estetica":true,"confianca":"alta","explicacao":"radiofrequência é um tratamento de rejuvenescimento facial e corporal"}`;

      const tools = config.pesquisaAtiva
        ? [{ type: 'web_search_20250305', name: 'web_search' }]
        : [];

      const body = {
        model: 'claude-sonnet-4-20250514',
        max_tokens: 300,
        system: 'És um especialista em estética e beleza. Respondes SEMPRE em JSON válido, sem texto adicional.',
        messages: [{ role: 'user', content: promptInterpretacao }]
      };

      if (tools.length) body.tools = tools;

      // Usa proxy Vercel em produção, directo em local
      const isVercel = window.location.protocol === 'https:' &&
                       !window.location.hostname.includes('localhost') &&
                       !window.location.protocol.includes('file');

      let res;
      if (isVercel) {
        res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: body.messages, system: body.system })
        });
      } else {
        res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': config.apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify(body)
        });
      }

      if (!res.ok) return mensagemOriginal;
      const dados = await res.json();

      let textoResposta = '';
      for (const bloco of dados.content) {
        if (bloco.type === 'text') textoResposta += bloco.text;
      }

      // Extrai JSON da resposta
      const jsonMatch = textoResposta.match(/\{[\s\S]*\}/);
      if (!jsonMatch) return mensagemOriginal;

      const interpretacao = JSON.parse(jsonMatch[0]);

      // Guarda a interpretação para uso posterior
      window._ultimaInterpretacao = interpretacao;

      // Devolve a mensagem interpretada/corrigida
      return interpretacao.mensagemInterpretada || mensagemOriginal;

    } catch(e) {
      console.warn('Interpretação falhou, usando original:', e);
      return mensagemOriginal;
    }
  }

  return mensagemOriginal;
}

// ──────────────────────────────────────────────
// CHAMADA AO CLAUDE COM API — com protocolo e pesquisa
// ──────────────────────────────────────────────
async function chamarClaude(pergunta) {
  const systemPrompt = construirSystemPrompt();

  const mensagens = historico.slice(-10).map(m => ({
    role: m.role,
    content: m.content
  }));
  if (!mensagens.length || mensagens[mensagens.length-1].content !== pergunta) {
    mensagens.push({ role: 'user', content: pergunta });
  }

  // ── Detecta se está no Vercel (domínio fixo) ou local ──
  // No Vercel → usa /api/chat (chave segura no servidor)
  // Local → chama a API directamente com a chave do dashboard
  const isVercel = window.location.protocol === 'https:' &&
                   !window.location.hostname.includes('localhost') &&
                   !window.location.protocol.includes('file');

  try {
    let res;

    if (isVercel) {
      // ── PRODUÇÃO: chave segura no servidor Vercel ──
      const body = { messages: mensagens, system: systemPrompt };
      if (config.pesquisaAtiva) {
        body.tools = [{ type: 'web_search_20250305', name: 'web_search' }];
      }
      res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    } else {
      // ── LOCAL / DESENVOLVIMENTO: chave do dashboard ──
      if (!config.apiKey) throw new Error('Sem API Key configurada');
      const body = {
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: systemPrompt,
        messages: mensagens
      };
      if (config.pesquisaAtiva) {
        body.tools = [{ type: 'web_search_20250305', name: 'web_search' }];
      }
      res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': config.apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify(body)
      });
    }

    if (!res.ok) throw new Error('Erro API: ' + res.status);
    const dados = await res.json();

    let texto = '';
    for (const bloco of dados.content) {
      if (bloco.type === 'text') texto += bloco.text;
    }

    return texto || 'Não consegui obter uma resposta. Tenta novamente ou contacta-nos diretamente.';

  } catch(e) {
    console.error('Erro Claude API:', e);
    return responderLocalmente(pergunta.toLowerCase(), false) ||
      `Para questões técnicas, contacta-nos:<br>📞 <b>${config.telefone || '—'}</b>`;
  }
}

REGRAS DE RESPOSTA
════════════════════════════════════
1. PREÇOS: Só apresentas quando a cliente perguntar explicitamente ("quanto custa", "qual o preço", "valor"). Ao listar serviços → só nome e duração.

5. MÚLTIPLOS TRATAMENTOS: Se vários resolvem o problema → apresenta TODOS de forma organizada.
6. PROTOCOLO: Lê SEMPRE os campos de protocolo antes de responder sobre qualquer tratamento.
7. RESTRIÇÕES MÉDICAS: Gravidez, amamentação, doenças, alergias → verifica contraindicações e informa claramente.

// ──────────────────────────────────────────────
// FUNÇÕES DE RESPOSTA LOCAL
// ──────────────────────────────────────────────
function procurarServico(texto) {
  // Usa procurarTodosServicos e devolve o mais relevante
  const todos = procurarTodosServicos(texto);
  return todos.length > 0 ? todos[0] : null;
}

// Procura TODOS os serviços que correspondem ao texto
// (descrição, indicações, nome, categoria, contraindicações, alertas)
function procurarTodosServicos(texto) {
  if (!config.servicos || !config.servicos.length) return [];
  const encontrados = [];

  // Stopwords — não contribuem para o match
  const stopwords = ['para','que','tem','qual','quais','como','onde','quando',
    'tenho','estou','com','uma','num','não','sim','mas','por','dos','das',
    'nos','nas','seu','sua','esse','esta','este','isso','aqui','voce','você',
    'minha','meu','meus','minhas','fazer','feito','sobre','algum','alguma',
    // Palavras genéricas que aparecem em todos os tratamentos — não devem fazer match
    'tratamento','tratamentos','procedimento','procedimentos','terapia',
    'sessao','sessoes','quero','gostaria','preciso','busco','procuro',
    'fazer','realizar','indicado','disponivel','disponível','nome','minha',
    'patricia','maria','ana','joao','jose'  // nomes não são tratamentos
  ];

  const textoNorm = texto.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

  const palavrasQuery = texto
    .toLowerCase()
    .split(/[\s,.\-\/\?!]+/)
    .filter(p => p.length > 3 && !stopwords.includes(p));

  // Sem palavras significativas — não filtra nada
  if (palavrasQuery.length === 0) return [];

  for (let s of config.servicos) {
    let pontuacao = 0;
    let matchNoNome = false;
    let matchNasIndicacoes = false;
    let matchNasKeywords = false;

    // ── Nível 1: KEYWORDS definidas pelo operador (peso máximo — 6 pts) ──
    // Match de frase completa ou parcial (≥50% das palavras)
    if (s.keywords && Array.isArray(s.keywords) && s.keywords.length > 0) {
      for (let kw of s.keywords) {
        const kwNorm = kw.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
        if (textoNorm.includes(kwNorm) || texto.toLowerCase().includes(kw.toLowerCase())) {
          pontuacao += 6;
          matchNasKeywords = true;
          break;
        }
        // Match parcial — metade das palavras da keyword presentes no texto
        const kwPalavras = kw.toLowerCase().split(' ').filter(p => p.length > 3);
        if (kwPalavras.length >= 2) {
          const hits = kwPalavras.filter(p => texto.toLowerCase().includes(p)).length;
          if (hits >= Math.ceil(kwPalavras.length / 2)) {
            pontuacao += hits * 2;
            if (pontuacao >= 4) matchNasKeywords = true;
          }
        }
      }
    }

    // ── Nível 2: NOME do serviço (3 pts por palavra) ──
    // Remove prefixos genéricos do nome antes de fazer match
    const prefixosGenericos = ['tratamento para ','tratamento de ','terapia para ',
      'procedimento para ','sessao de ','sessão de '];
    let nomeReduzido = s.nome.toLowerCase();
    prefixosGenericos.forEach(p => { nomeReduzido = nomeReduzido.replace(p,''); });

    const palavrasNome = nomeReduzido.split(' ').filter(p =>
      p.length > 3 &&
      !['para','tratamento','terapia','procedimento','sessao','sessão'].includes(p)
    );
    for (let p of palavrasNome) {
      const pNorm = p.normalize('NFD').replace(/[̀-ͯ]/g,'');
      if (texto.toLowerCase().includes(p) || textoNorm.includes(pNorm)) {
        pontuacao += 3;
        matchNoNome = true;
      }
    }
    // Fuzzy no nome
    if (!matchNoNome) {
      for (let p of palavrasNome) {
        if (p.length >= 5 && fuzzyMatch(texto.toLowerCase(), p)) {
          pontuacao += 2; matchNoNome = true; break;
        }
      }
    }

    // ── Nível 3: CATEGORIA (2 pts) ──
    const cat = (s.categoria||'').toLowerCase();
    if (cat && texto.toLowerCase().includes(cat)) pontuacao += 2;

    // ── Nível 4: INDICAÇÕES (3 pts por palavra — alto peso) ──
    // As indicações dizem explicitamente para que serve o serviço
    if (s.indicacoes) {
      const indNorm = s.indicacoes.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
      const indLower = s.indicacoes.toLowerCase();

      // Frase completa nas indicações
      if (palavrasQuery.length >= 2) {
        const frase = palavrasQuery.slice(0,3).join(' ');
        const fraseNorm = frase.normalize('NFD').replace(/[̀-ͯ]/g,'');
        if (indLower.includes(frase) || indNorm.includes(fraseNorm)) {
          pontuacao += 5; matchNasIndicacoes = true;
        }
      }

      // Palavras individuais nas indicações
      const palavrasInd = indLower.split(/[\s,.\-\/;()]+/).filter(p => p.length > 4);
      let hitsInd = 0;
      for (let pq of palavrasQuery) {
        const pqNorm = pq.normalize('NFD').replace(/[̀-ͯ]/g,'');
        if (palavrasInd.some(pi => pi === pq || pi.includes(pq) ||
            pi.normalize('NFD').replace(/[̀-ͯ]/g,'').includes(pqNorm))) {
          hitsInd++;
        }
      }
      // Regra: 1 palavra nas indicações conta SE query tem 1 palavra
      //        2+ palavras nas indicações conta sempre
      if (hitsInd >= 2 || (hitsInd === 1 && palavrasQuery.length === 1)) {
        pontuacao += hitsInd * 3;
        matchNasIndicacoes = true;
      }
    }

    // ── Nível 5: DESCRIÇÃO (1 pt por palavra — peso baixo) ──
    // Só conta se houver 2+ palavras da query na descrição
    // Evita falsos positivos por palavras como "localizada", "pele", etc.
    if (s.descricao && !matchNasKeywords) {
      const descLower = s.descricao.toLowerCase();
      const descNorm = descLower.normalize('NFD').replace(/[̀-ͯ]/g,'');

      // Frase completa na descrição (peso médio)
      if (palavrasQuery.length >= 2) {
        const frase = palavrasQuery.slice(0,3).join(' ');
        const fraseNorm = frase.normalize('NFD').replace(/[̀-ͯ]/g,'');
        if (descLower.includes(frase) || descNorm.includes(fraseNorm)) {
          pontuacao += 4;
        }
      }

      // Palavras individuais — requer MÍNIMO 2 para contar
      const palavrasDesc = descLower.split(/[\s,.\-\/;()]+/).filter(p => p.length > 4);
      let hitsDesc = 0;
      for (let pq of palavrasQuery) {
        const pqNorm = pq.normalize('NFD').replace(/[̀-ͯ]/g,'');
        if (palavrasDesc.some(pd => pd === pq || pd.includes(pq) ||
            pd.normalize('NFD').replace(/[̀-ͯ]/g,'').includes(pqNorm))) {
          hitsDesc++;
        }
      }
      // Descrição: só conta se ≥2 palavras coincidem E o serviço não é primariamente para outra coisa
      if (hitsDesc >= 2) {
        pontuacao += hitsDesc; // Peso baixo (1 pt por palavra)
      }
    }

    // ── LIMIAR FINAL ──
    // >= 4: garante que é preciso mais do que 1 palavra isolada numa descrição
    // Excepção: keywords definidas pelo operador sempre passam com >= 4
    const limiar = matchNasKeywords ? 4 : (matchNoNome || matchNasIndicacoes ? 3 : 5);

    if (pontuacao >= limiar) {
      encontrados.push({ servico: s, pontuacao });
    }
  }

  // Ordena por pontuação descendente
  encontrados.sort((a, b) => b.pontuacao - a.pontuacao);
  return encontrados.map(e => e.servico);
}

// Extrai os serviços mencionados no histórico da conversa actual
function servicosDaConversa() {
  if (!config.servicos || !config.servicos.length) return [];
  if (!historico || !historico.length) return config.servicos;

  // Junta todo o texto da conversa
  const textoConversa = historico
    .map(m => m.content || '')
    .join(' ')
    .toLowerCase();

  // Filtra só os serviços que foram mencionados na conversa
  const mencionados = config.servicos.filter(s => {
    const palavrasNome = s.nome.toLowerCase().split(' ').filter(p => p.length > 3);
    return palavrasNome.some(p => textoConversa.includes(p));
  });

  // Se não encontrou nenhum mencionado, usa todos
  return mencionados.length > 0 ? mencionados : config.servicos;
}

// Procura nos protocolos DOS SERVIÇOS DA CONVERSA ACTUAL
// por informação sobre restrições/condições
function procurarNosProtocolos(texto) {
  if (!config.servicos || !config.servicos.length) return [];

  // Usa só os serviços mencionados na conversa actual
  const servicosParaVerificar = servicosDaConversa();
  const resultados = [];

  const camposProtocolo = [
    { campo: 'contraindicacoes', label: 'Contraindicações' },
    { campo: 'alertas',          label: 'Alertas' },
    { campo: 'reacoes',          label: 'Reações normais' },
    { campo: 'pre',              label: 'Pré-tratamento' },
    { campo: 'pos',              label: 'Pós-tratamento' },
    { campo: 'indicacoes',       label: 'Indicações' },
  ];

  // Palavras da mensagem do cliente (remove artigos e palavras curtas)
  const stopwords = ['tenho','estou','com','que','para','uma','num','não','sim','mas','por'];
  const palavrasBusca = texto
    .toLowerCase()
    .split(/[\s,.\-\/]+/)
    .filter(p => p.length > 3 && !stopwords.includes(p));

  for (let s of servicosParaVerificar) {
    let matchEncontrado = false;

    for (let { campo, label } of camposProtocolo) {
      if (!s[campo] || matchEncontrado) continue;
      const conteudo = s[campo].toLowerCase();

      // Verifica correspondência — incluindo variações (atópica/atopica)
      const conteudoSemAcentos = conteudo.normalize('NFD').replace(/[̀-ͯ]/g,'');

      for (let p of palavrasBusca) {
        const pSemAcentos = p.normalize('NFD').replace(/[̀-ͯ]/g,'');
        if (conteudo.includes(p) || conteudoSemAcentos.includes(pSemAcentos)) {
          resultados.push({ servico: s, campo: label, conteudo: s[campo] });
          matchEncontrado = true;
          break;
        }
      }
    }
  }
  return resultados;
}

// Tolerância a erros de digitação — devolve true se 'texto' contém
// uma substring com distância de Levenshtein <= 1 de 'palavra'
function fuzzyMatch(texto, palavra) {
  if (texto.includes(palavra)) return true;
  // Verifica substrings do mesmo tamanho
  for (let i = 0; i <= texto.length - palavra.length; i++) {
    const sub = texto.slice(i, i + palavra.length);
    let diff = 0;
    for (let j = 0; j < palavra.length; j++) {
      if (sub[j] !== palavra[j]) diff++;
      if (diff > 1) break;
    }
    if (diff <= 1) return true;
  }
  return false;
}

// Formata resposta sobre protocolos — separa PODE FAZER vs NÃO PODE FAZER
function formatarRespostaProtocolo(resultados, pergunta) {
  // Determina a condição do cliente pela conversa
  const servicosConversa = servicosDaConversa();

  // Separa serviços em: NÃO PODE (contraindicação encontrada) vs PODE
  const naoPode = [];
  const informacaoRelevante = [];

  resultados.forEach(({ servico, campo, conteudo }) => {
    if (campo === 'Contraindicações' || campo === 'Alertas') {
      naoPode.push({ servico, campo, conteudo });
    } else {
      informacaoRelevante.push({ servico, campo, conteudo });
    }
  });

  // Serviços da conversa sem restrição para a condição mencionada
  const nomesComRestricao = resultados.map(r => r.servico.nome);
  const podeFazer = servicosConversa.filter(s => !nomesComRestricao.includes(s.nome));

  let html = '';

  // Serviços NÃO recomendados
  if (naoPode.length > 0) {
    html += `<div style="background:#fde8e8;border-left:3px solid #e53935;border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:10px">`;
    html += `<b style="color:#c62828">⚠️ Não recomendado para si:</b><br>`;
    naoPode.forEach(({ servico, campo, conteudo }) => {
      html += `<div style="margin-top:6px">${servico.emoji} <b>${servico.nome}</b> — ${campo}: ${conteudo}</div>`;
    });
    html += `</div>`;
  }

  // Informação relevante (alertas, reações)
  if (informacaoRelevante.length > 0) {
    html += `<div style="background:#fff8e1;border-left:3px solid #f9a825;border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:10px">`;
    html += `<b style="color:#e65100">ℹ️ Informação importante:</b><br>`;
    informacaoRelevante.forEach(({ servico, campo, conteudo }) => {
      html += `<div style="margin-top:6px">${servico.emoji} <b>${servico.nome}</b> — ${campo}: ${conteudo}</div>`;
    });
    html += `</div>`;
  }

  // Serviços que PODE fazer
  if (podeFazer.length > 0) {
    html += `<div style="background:#e8f5e9;border-left:3px solid #43a047;border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:10px">`;
    html += `<b style="color:#2e7d32">✅ Pode realizar sem restrições:</b><br>`;
    podeFazer.forEach(s => {
      html += `<div style="margin-top:6px">${s.emoji} <b>${s.nome}</b></div>`;
    });
    html += `</div>`;
  }

  html += `<div style="font-size:12px;color:var(--muted);margin-top:8px">⚕️ Recomendamos sempre uma consulta de avaliação antes de iniciar qualquer tratamento. 📞 <b>${config.telefone || '—'}</b></div>`;
  return html;
}

let _contadorNegativo = 0;

// Serviço não disponível — respostas randomizadas
function respostaNaoTemos() {
  _contadorNegativo++;

  const listaServicos = () => {
    if (!config.servicos || !config.servicos.length) return 'Tem interesse em algum outro procedimento?';
    let r = 'Os nossos procedimentos disponíveis:<br><br>';
    config.servicos.forEach(s => { r += `${s.emoji} ${s.nome}<br>`; });
    return r;
  };

  const respostas = [
    `No momento, não temos este tratamento disponível. 😊<br><br>${listaServicos()}`,
    `Este procedimento ainda não faz parte do nosso menu de serviços. Posso ajudá-la com outro tratamento?<br><br>${listaServicos()}`,
    `Por enquanto não oferecemos este serviço, mas temos outras opções que podem interessar! ✨<br><br>${listaServicos()}`,
    `Ainda não trabalhamos com este tratamento. Posso apresentar o que temos disponível?<br><br>${listaServicos()}`,
    `Este tratamento não está disponível no momento. Que tal conhecer os nossos outros procedimentos?<br><br>${listaServicos()}`,
  ];

  // Alterna as respostas — nunca repete a mesma duas vezes seguidas
  const idx = (_contadorNegativo - 1) % respostas.length;
  return respostas[idx];
}

// Assunto desconhecido — respostas randomizadas
function respostaNaoSei() {
  _contadorNegativo++;
  const tel = config.telefone || '—';

  const respostas = [
    `Por não ter informação sobre este assunto, peço que entre em contacto por telefone ou mensagem pelo 📞 <b>${tel}</b>`,
    `Não tenho dados suficientes para responder a esta questão. Para uma ajuda mais completa, contacte-nos: 📞 <b>${tel}</b>`,
    `Esta questão está fora do que consigo responder aqui. A nossa equipa terá todo o gosto em ajudar: 📞 <b>${tel}</b>`,
    `Para esta questão específica, sugiro que fale directamente com a nossa equipa: 📞 <b>${tel}</b>`,
    `Não quero dar-lhe uma informação incorrecta — o melhor é contactar-nos directamente: 📞 <b>${tel}</b>`,
  ];

  const idx = (_contadorNegativo - 1) % respostas.length;
  return respostas[idx];
}

// Reset do contador quando há uma resposta positiva
function resetarContadorNegativo() {
  _contadorNegativo = 0;
}

function respostaHorario() {
  const dias = (config.diasAtivos || [1,2,3,4,5]).map(i => DIAS_NOMES[i]).join(', ');
  return `🕐 Estamos abertos:<br><br>
    <b>${dias}</b><br>
    Das <b>${config.horaAbertura || '09:00'}</b> às <b>${config.horaFecho || '20:00'}</b>`;
}

function respostaMarcacao() {
  return config.msgMarcacao ||
    `📅 Para agendar, preciso de:<br><br>
    👤 O teu <b>nome</b><br>
    💆 O <b>serviço</b> desejado<br>
    📅 A <b>data e hora</b> preferida<br><br>
    Ou contacta-nos diretamente:<br>
    📞 <b>${config.telefone || '—'}</b>`;
}

function respostaContactos() {
  let html = '📋 Os nossos contactos:<br><br>';
  if (config.telefone) html += `📞 <b>${config.telefone}</b><br>`;
  if (config.email) html += `📧 <b>${config.email}</b><br>`;
  if (config.morada) html += `📍 <b>${config.morada}</b>`;
  return html || 'Contactos ainda não configurados.';
}

// ──────────────────────────────────────────────
// HISTÓRICO PERSISTENTE
// ──────────────────────────────────────────────
function guardarHistorico() {
  try { localStorage.setItem('beautybot_hist', JSON.stringify(historico.slice(-30))); } catch(e) {}
}

function carregarHistorico() {
  try {
    const h = localStorage.getItem('beautybot_hist');
    if (!h) return false;
    const p = JSON.parse(h);
    if (!p.length) return false;
    historico = p; return true;
  } catch(e) { return false; }
}

// ──────────────────────────────────────────────
// INIT
// ──────────────────────────────────────────────
window.onload = async function() {
  const temConfig = carregarConfig();
  if (!temConfig) {
    document.getElementById('aviso-config').style.display = 'block';
    document.getElementById('chat-input').disabled = true;
    document.getElementById('chat-send').disabled = true;
    return;
  }

  aplicarIdentidade();
  renderChips();

  const temHistorico = carregarHistorico();

  if (temHistorico) {
    // Reconstrói mensagens anteriores
    const msgs = document.getElementById('chat-msgs');
    historico.forEach(m => {
      const el = document.createElement('div');
      if (m.role === 'assistant') {
        el.className = 'msg-bot';
        el.innerHTML = `<div class="msg-bot-nome">${config.nomeAssistente||'Bot'}</div><div class="msg-bot-balao">${m.content}</div>`;
      } else {
        el.className = 'msg-user';
        el.innerHTML = `<div class="msg-user-balao">${m.content}</div>`;
      }
      msgs.appendChild(el);
    });
    msgs.scrollTop = msgs.scrollHeight;
    // Só mostra "bem-vinda de volta" se houver histórico real (mais de 2 trocas)
    if (historico.length > 4) {
      await adicionarMsgBot(`Bem-vinda de volta! 👋 Posso continuar a ajudar?`);
    }
  } else {
    const msgBV = config.msgBoasVindas ||
      `Olá! 👋 Sou ${config.nomeAssistente || 'a assistente'} de ${config.nomeNegocio || 'o nosso espaço'}. Como posso ajudar?`;
    await adicionarMsgBot(msgBV, false);
  }

  window.addEventListener('beforeunload', guardarHistorico);
};
</script>
