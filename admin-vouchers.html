<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Vouchers - BeautyBot Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input, select, textarea {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-group {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-label input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #ff4757;
            color: white;
        }

        .btn-secondary {
            background: #f1f3f5;
            color: #333;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        .voucher-list {
            margin-top: 20px;
        }

        .voucher-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .voucher-card.inactive {
            opacity: 0.6;
            border-left-color: #ccc;
        }

        .voucher-info {
            flex: 1;
        }

        .voucher-code {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            font-family: 'Courier New', monospace;
        }

        .voucher-details {
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }

        .voucher-detail-item {
            display: inline-block;
            margin-right: 20px;
        }

        .voucher-actions {
            display: flex;
            gap: 10px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success {
            background: #51cf66;
            color: white;
        }

        .badge-danger {
            background: #ff4757;
            color: white;
        }

        .badge-warning {
            background: #ffd43b;
            color: #333;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d3f9d8;
            color: #2b8a3e;
            border-left: 4px solid #51cf66;
        }

        .alert-error {
            background: #ffe3e3;
            color: #c92a2a;
            border-left: 4px solid #ff4757;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/admin.html" class="back-link">← Voltar ao Dashboard Admin</a>
        
        <h1>🎟️ Gestão de Vouchers</h1>
        <p class="subtitle">Crie e gerencie códigos de desconto para BeautyBot</p>

        <div id="alert"></div>

        <!-- Estatísticas -->
        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalVouchers">-</div>
                <div class="stat-label">Total de Vouchers</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="activeVouchers">-</div>
                <div class="stat-label">Vouchers Ativos</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalUses">-</div>
                <div class="stat-label">Total de Usos</div>
            </div>
        </div>

        <!-- Criar Novo Voucher -->
        <div class="section">
            <h2 class="section-title">Criar Novo Voucher</h2>
            
            <div class="form-grid">
                <div class="form-group">
                    <label for="voucherCode">Código do Voucher *</label>
                    <input type="text" id="voucherCode" placeholder="ex: NATAL2024" style="text-transform: uppercase;">
                </div>

                <div class="form-group">
                    <label for="discountType">Tipo de Desconto *</label>
                    <select id="discountType">
                        <option value="percentage">Percentual (%)</option>
                        <option value="fixed">Valor Fixo (€)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="discountValue">Valor do Desconto *</label>
                    <input type="number" id="discountValue" placeholder="ex: 20" min="0" step="0.01">
                </div>

                <div class="form-group">
                    <label for="maxUses">Limite de Usos</label>
                    <input type="number" id="maxUses" placeholder="Deixe vazio para ilimitado" min="1">
                </div>

                <div class="form-group">
                    <label for="validFrom">Válido Desde</label>
                    <input type="datetime-local" id="validFrom">
                </div>

                <div class="form-group">
                    <label for="validUntil">Válido Até</label>
                    <input type="datetime-local" id="validUntil">
                </div>
            </div>

            <div class="form-group">
                <label>Planos Aplicáveis *</label>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="planEssential" value="essential" checked>
                        Essencial (€97/mês)
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="planPremium" value="premium" checked>
                        Premium (€197/mês)
                    </label>
                </div>
            </div>

            <button class="btn btn-primary" onclick="createVoucher()">✨ Criar Voucher</button>
        </div>

        <!-- Lista de Vouchers -->
        <div class="section">
            <h2 class="section-title">Vouchers Existentes</h2>
            <div id="voucherList" class="voucher-list">
                <div class="loading">Carregando vouchers...</div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://cdhtcfvvxktouvusyosu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkaHRjZnZ2eGt0b3V2dXN5b3N1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMDA2MTQsImV4cCI6MjA5MjU3NjYxNH0.lfW19Z_N-eF1DiLcQF8E_jAdU0Fiq2NbQxLYnC0gPWo';
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = null;

        // Verificar autenticação ao carregar
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            
            if (!session) {
                window.location.href = '/login.html';
                return;
            }

            currentUser = session.user;

            // Verificar se é admin
            const { data: profile } = await supabase
                .from('profiles')
                .select('role')
                .eq('id', currentUser.id)
                .single();

            if (profile?.role !== 'admin') {
                alert('Acesso negado. Apenas administradores podem acessar esta página.');
                window.location.href = '/dashboard.html';
                return;
            }

            // Definir data atual nos campos de data
            const now = new Date();
            document.getElementById('validFrom').value = now.toISOString().slice(0, 16);

            // Carregar vouchers
            await loadVouchers();
        });

        async function loadVouchers() {
            try {
                const response = await fetch('/api/vouchers', {
                    headers: {
                        'Authorization': `Bearer ${(await supabase.auth.getSession()).data.session.access_token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Erro ao carregar vouchers');
                }

                const data = await response.json();
                displayVouchers(data.vouchers);
                updateStats(data.vouchers);
            } catch (error) {
                console.error('Erro:', error);
                showAlert('Erro ao carregar vouchers: ' + error.message, 'error');
            }
        }

        function displayVouchers(vouchers) {
            const container = document.getElementById('voucherList');
            
            if (!vouchers || vouchers.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666;">Nenhum voucher criado ainda.</p>';
                return;
            }

            container.innerHTML = vouchers.map(voucher => {
                const isActive = voucher.active;
                const usageText = voucher.max_uses 
                    ? `${voucher.current_uses}/${voucher.max_uses} usos` 
                    : `${voucher.current_uses} usos`;
                
                const discountText = voucher.discount_type === 'percentage'
                    ? `${voucher.discount_value}%`
                    : `€${voucher.discount_value}`;

                const validUntil = voucher.valid_until 
                    ? new Date(voucher.valid_until).toLocaleDateString('pt-PT')
                    : 'Sem limite';

                return `
                    <div class="voucher-card ${!isActive ? 'inactive' : ''}">
                        <div class="voucher-info">
                            <div class="voucher-code">${voucher.code}</div>
                            <div class="voucher-details">
                                <span class="voucher-detail-item">
                                    <strong>Desconto:</strong> ${discountText}
                                </span>
                                <span class="voucher-detail-item">
                                    <strong>Usos:</strong> ${usageText}
                                </span>
                                <span class="voucher-detail-item">
                                    <strong>Válido até:</strong> ${validUntil}
                                </span>
                                <span class="voucher-detail-item">
                                    <strong>Planos:</strong> ${voucher.applicable_plans.join(', ')}
                                </span>
                            </div>
                        </div>
                        <div class="voucher-actions">
                            <span class="badge ${isActive ? 'badge-success' : 'badge-danger'}">
                                ${isActive ? 'Ativo' : 'Inativo'}
                            </span>
                            <button class="btn btn-secondary btn-small" onclick="toggleVoucher('${voucher.id}', ${!isActive})">
                                ${isActive ? 'Desativar' : 'Ativar'}
                            </button>
                            <button class="btn btn-danger btn-small" onclick="deleteVoucher('${voucher.id}')">
                                Excluir
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateStats(vouchers) {
            const total = vouchers.length;
            const active = vouchers.filter(v => v.active).length;
            const totalUses = vouchers.reduce((sum, v) => sum + v.current_uses, 0);

            document.getElementById('totalVouchers').textContent = total;
            document.getElementById('activeVouchers').textContent = active;
            document.getElementById('totalUses').textContent = totalUses;
        }

        async function createVoucher() {
            const code = document.getElementById('voucherCode').value.trim().toUpperCase();
            const discountType = document.getElementById('discountType').value;
            const discountValue = parseFloat(document.getElementById('discountValue').value);
            const maxUses = document.getElementById('maxUses').value;
            const validFrom = document.getElementById('validFrom').value;
            const validUntil = document.getElementById('validUntil').value;
            
            const applicablePlans = [];
            if (document.getElementById('planEssential').checked) applicablePlans.push('essential');
            if (document.getElementById('planPremium').checked) applicablePlans.push('premium');

            // Validações
            if (!code) {
                showAlert('Por favor, insira um código de voucher', 'error');
                return;
            }

            if (!discountValue || discountValue <= 0) {
                showAlert('Por favor, insira um valor de desconto válido', 'error');
                return;
            }

            if (discountType === 'percentage' && discountValue > 100) {
                showAlert('Desconto percentual não pode ser maior que 100%', 'error');
                return;
            }

            if (applicablePlans.length === 0) {
                showAlert('Selecione pelo menos um plano aplicável', 'error');
                return;
            }

            try {
                const response = await fetch('/api/vouchers', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${(await supabase.auth.getSession()).data.session.access_token}`
                    },
                    body: JSON.stringify({
                        code,
                        discount_type: discountType,
                        discount_value: discountValue,
                        max_uses: maxUses ? parseInt(maxUses) : null,
                        valid_from: validFrom ? new Date(validFrom).toISOString() : null,
                        valid_until: validUntil ? new Date(validUntil).toISOString() : null,
                        applicable_plans: applicablePlans
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Erro ao criar voucher');
                }

                showAlert(`Voucher "${code}" criado com sucesso! 🎉`, 'success');
                
                // Limpar formulário
                document.getElementById('voucherCode').value = '';
                document.getElementById('discountValue').value = '';
                document.getElementById('maxUses').value = '';
                document.getElementById('validUntil').value = '';

                // Recarregar lista
                await loadVouchers();

            } catch (error) {
                console.error('Erro:', error);
                showAlert('Erro ao criar voucher: ' + error.message, 'error');
            }
        }

        async function toggleVoucher(id, activate) {
            try {
                const response = await fetch('/api/vouchers', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${(await supabase.auth.getSession()).data.session.access_token}`
                    },
                    body: JSON.stringify({
                        id,
                        active: activate
                    })
                });

                if (!response.ok) {
                    throw new Error('Erro ao atualizar voucher');
                }

                showAlert(`Voucher ${activate ? 'ativado' : 'desativado'} com sucesso!`, 'success');
                await loadVouchers();

            } catch (error) {
                console.error('Erro:', error);
                showAlert('Erro ao atualizar voucher: ' + error.message, 'error');
            }
        }

        async function deleteVoucher(id) {
            if (!confirm('Tem certeza que deseja excluir este voucher? Esta ação não pode ser desfeita.')) {
                return;
            }

            try {
                const response = await fetch(`/api/vouchers?id=${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${(await supabase.auth.getSession()).data.session.access_token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Erro ao excluir voucher');
                }

                showAlert('Voucher excluído com sucesso!', 'success');
                await loadVouchers();

            } catch (error) {
                console.error('Erro:', error);
                showAlert('Erro ao excluir voucher: ' + error.message, 'error');
            }
        }

        function showAlert(message, type) {
            const alertDiv = document.getElementById('alert');
            alertDiv.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => {
                alertDiv.innerHTML = '';
            }, 5000);
        }
    </script>
</body>
</html>
