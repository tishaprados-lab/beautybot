<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeautyBot Widget</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    /* HEADER */
    .chat-header {
      background: linear-gradient(135deg, #C4737F 0%, #a85e6a 100%);
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .header-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .bot-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    
    .bot-details h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    
    .bot-details p {
      font-size: 12px;
      opacity: 0.9;
    }
    
    .close-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    
    .close-btn:hover {
      background: rgba(255,255,255,0.3);
    }
    
    /* MESSAGES */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .message {
      display: flex;
      gap: 12px;
      animation: slideIn 0.3s ease;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .message.user {
      flex-direction: row-reverse;
    }
    
    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    
    .message.bot .message-avatar {
      background: linear-gradient(135deg, #C4737F 0%, #a85e6a 100%);
      color: white;
    }
    
    .message.user .message-avatar {
      background: #e9ecef;
    }
    
    .message-content {
      background: white;
      padding: 12px 16px;
      border-radius: 16px;
      max-width: 75%;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      line-height: 1.5;
      font-size: 14px;
    }
    
    .message.user .message-content {
      background: #C4737F;
      color: white;
    }
    
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
    }
    
    .typing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #999;
      animation: typing 1.4s infinite;
    }
    
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    
    @keyframes typing {
      0%, 60%, 100% { opacity: 0.3; }
      30% { opacity: 1; }
    }
    
    /* INPUT */
    .chat-input {
      padding: 16px 20px;
      background: white;
      border-top: 1px solid #e9ecef;
      display: flex;
      gap: 12px;
    }
    
    .chat-input textarea {
      flex: 1;
      border: 1px solid #dee2e6;
      border-radius: 20px;
      padding: 10px 16px;
      font-family: inherit;
      font-size: 14px;
      resize: none;
      outline: none;
      max-height: 120px;
      transition: border-color 0.2s;
    }
    
    .chat-input textarea:focus {
      border-color: #C4737F;
    }
    
    .send-btn {
      background: linear-gradient(135deg, #C4737F 0%, #a85e6a 100%);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    
    .send-btn:hover {
      transform: scale(1.05);
    }
    
    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    /* POWERED BY */
    .powered-by {
      text-align: center;
      padding: 8px;
      font-size: 11px;
      color: #6c757d;
      background: #f8f9fa;
      border-top: 1px solid #e9ecef;
    }
    
    .powered-by a {
      color: #C4737F;
      text-decoration: none;
      font-weight: 600;
    }
    
    /* LOADING */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-size: 14px;
      color: #6c757d;
    }
  </style>
</head>
<body>
  
  <div id="loading" class="loading">
    Carregando...
  </div>
  
  <div id="chat-container" style="display: none; height: 100%; display: flex; flex-direction: column;">
    <!-- HEADER -->
    <div class="chat-header">
      <div class="header-info">
        <div class="bot-avatar">🌸</div>
        <div class="bot-details">
          <h3 id="bot-name">Sofia</h3>
          <p id="clinic-name">Assistente Virtual</p>
        </div>
      </div>
      <button class="close-btn" onclick="closeWidget()">✕</button>
    </div>
    
    <!-- MESSAGES -->
    <div class="chat-messages" id="messages"></div>
    
    <!-- INPUT -->
    <div class="chat-input">
      <textarea 
        id="input" 
        placeholder="Escreva a sua mensagem..."
        rows="1"
        onkeydown="handleKeyPress(event)"
      ></textarea>
      <button class="send-btn" onclick="sendMessage()" id="send-btn">
        ➤
      </button>
    </div>
    
    <!-- POWERED BY -->
    <div class="powered-by">
      Powered by <a href="https://beautybot.pt" target="_blank">BeautyBot</a>
    </div>
  </div>

  <script>
    // ============================================
    // CONFIGURATION
    // ============================================
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('userId');
    
    let conversationHistory = [];
    let isLoading = false;
    let botConfig = {
      name: 'Sofia',
      clinicName: 'Assistente Virtual'
    };
    
    // Supabase client
    const { createClient } = supabase;
    const supabaseClient = createClient(
      'https://cdhtcfvvxktouvusyosu.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkaHRjZnZ2eGt0b3V2dXN5b3N1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNzIyMDQsImV4cCI6MjA5MjY0ODIwNH0.V5iQaE5rwfvBNOpJZp4OMPqq4mPQc4t0KbSzBGMm5kY'
    );
    
    // ============================================
    // INITIALIZATION
    // ============================================
    async function init() {
      if (!userId) {
        showError('Configuração inválida');
        return;
      }
      
      // Fetch bot config
      try {
        const { data: profile } = await supabaseClient
          .from('profiles')
          .select('chatbot_config, clinic_name')
          .eq('id', userId)
          .single();
        
        if (profile?.chatbot_config) {
          botConfig.name = profile.chatbot_config.chatbot_name || 'Sofia';
          botConfig.clinicName = profile.chatbot_config.business_name || profile.clinic_name || 'Assistente Virtual';
        }
        
        updateHeader();
        
        document.getElementById('loading').style.display = 'none';
        document.getElementById('chat-container').style.display = 'flex';
        
        // Welcome message
        addMessage('bot', `Olá! 😊 Sou ${botConfig.name}. Como posso ajudar hoje?`);
        
      } catch (error) {
        console.error('Init error:', error);
        showError('Erro ao carregar chatbot');
      }
    }
    
    function updateHeader() {
      document.getElementById('bot-name').textContent = botConfig.name;
      document.getElementById('clinic-name').textContent = botConfig.clinicName;
    }
    
    function showError(message) {
      document.getElementById('loading').innerHTML = `
        <div style="text-align: center;">
          <div style="font-size: 32px; margin-bottom: 12px;">⚠️</div>
          <div>${message}</div>
        </div>
      `;
    }
    
    // ============================================
    // MESSAGING
    // ============================================
    function addMessage(role, content) {
      const messagesDiv = document.getElementById('messages');
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${role}`;
      
      const avatar = role === 'bot' ? '🌸' : '👤';
      
      messageDiv.innerHTML = `
        <div class="message-avatar">${avatar}</div>
        <div class="message-content">${content}</div>
      `;
      
      messagesDiv.appendChild(messageDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      
      // Add to history
      conversationHistory.push({
        role: role === 'bot' ? 'assistant' : 'user',
        content: content
      });
    }
    
    function showTyping() {
      const messagesDiv = document.getElementById('messages');
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message bot';
      typingDiv.id = 'typing';
      typingDiv.innerHTML = `
        <div class="message-avatar">🌸</div>
        <div class="message-content typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      `;
      messagesDiv.appendChild(typingDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
    
    function hideTyping() {
      const typingDiv = document.getElementById('typing');
      if (typingDiv) typingDiv.remove();
    }
    
    async function sendMessage() {
      const input = document.getElementById('input');
      const message = input.value.trim();
      
      if (!message || isLoading) return;
      
      // Add user message
      addMessage('user', message);
      input.value = '';
      input.style.height = 'auto';
      
      // Disable input
      isLoading = true;
      document.getElementById('send-btn').disabled = true;
      
      // Show typing
      showTyping();
      
      try {
        const response = await fetch('https://beautybot.pt/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: conversationHistory,
            userId: userId
          })
        });
        
        const data = await response.json();
        
        hideTyping();
        
        if (data.content && data.content[0]) {
          addMessage('bot', data.content[0].text);
        } else {
          addMessage('bot', 'Desculpe, ocorreu um erro. Tente novamente.');
        }
        
      } catch (error) {
        console.error('Send error:', error);
        hideTyping();
        addMessage('bot', 'Erro de conexão. Por favor, tente novamente.');
      } finally {
        isLoading = false;
        document.getElementById('send-btn').disabled = false;
        input.focus();
      }
    }
    
    function handleKeyPress(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
      
      // Auto-resize
      const textarea = event.target;
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
    }
    
    function closeWidget() {
      window.parent.postMessage({ action: 'close' }, 'https://beautybot.pt');
    }
    
    // ============================================
    // START
    // ============================================
    init();
  </script>
</body>
</html>
